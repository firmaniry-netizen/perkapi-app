name: perkapi
description: PERKAPI - Platform Digital Organisasi Kurator, Kepailitan & PKPU
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Teks bawaan sistem (salin, tempel, tombol kembali, kalender) dalam bahasa Indonesia.
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  intl: any
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  mobile_scanner: ^6.0.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.1
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^10.1.4
  model_viewer_plus: ^1.10.0
  sensors_plus: ^6.0.1
  quick_actions: ^1.1.0
  pdf: ^3.11.1
  path_provider: ^2.1.5
  # chat: telepon/video call (WebRTC), rekam & putar pesan suara
  flutter_webrtc: '>=0.12.0 <2.0.0'
  record: '>=5.2.0 <7.0.0'
  audioplayers: '>=6.1.0 <7.0.0'
  # layar dering panggilan masuk bawaan sistem saat aplikasi tertutup (Android)
  flutter_callkit_incoming: ^3.1.0
  firebase_core: any
  firebase_messaging: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - images/
    - images/foto/ # foto asli kegiatan PERKAPI + foto bertema hukum (lib/core/constants/app_photos.dart)
    - images/kartu/ # latar ID card digital (dari desain resmi idcard_perkapi.pdf)
    - assets/models/
    - assets/sounds/ # nada dering & nada sambung telepon
  fonts:
    # Phosphor Icons (MIT, lihat fonts/LICENSE-Phosphor.txt). Konstanta ikon: lib/core/constants/phosphor_icons.dart
    - family: PhosphorRegular
      fonts:
        - asset: fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: fonts/Phosphor-Fill.ttf

# Splash bawaan sistem (layar sebelum Flutter siap). Buat ulang dengan: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#000000"
  image: images/splash_logo.png
  web: false
  android_12:
    color: "#000000"
    image: images/splash_logo_a12.png