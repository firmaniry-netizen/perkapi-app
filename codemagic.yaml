# Build otomatis PERKAPI di Codemagic (mesin Mac di cloud — tidak perlu Mac/Xcode sendiri).
# Panduan lengkap: docs/RILIS-IOS.md
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PERKAPI App Store Connect   # nama kunci API di Codemagic: Team settings → Integrations
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: id.or.perkapi.app
      groups:
        - firebase   # berisi FIREBASE_OPTIONS_DART & GOOGLE_SERVICES_JSON (lihat docs/RILIS-IOS.md)
      vars:
        APP_STORE_APPLE_ID: 0000000000   # GANTI: App Store Connect → aplikasi PERKAPI → App Information → Apple ID
    scripts:
      - name: Pasang konfigurasi Firebase dari variabel rahasia (tidak disimpan di Git)
        script: |
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Ambil paket Flutter
        script: flutter pub get
      - name: Pasang profil penandatanganan
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          flutter build ipa --release \
            --build-number=$((LAST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-cek:
    name: iOS → cek build (tanpa akun Apple)
    # Memastikan kode bisa dikompilasi untuk iPhone SEBELUM punya akun Apple Developer.
    # Hasilnya Runner.app tanpa tanda tangan: tidak bisa dipasang di iPhone, hanya bukti build lolos.
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase
    scripts:
      - name: Pasang konfigurasi Firebase dari variabel rahasia (tidak disimpan di Git)
        script: |
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Ambil paket Flutter
        script: flutter pub get
      - name: Build iOS tanpa tanda tangan
        script: flutter build ios --release --no-codesign
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  ios-simulator:
    name: iOS → simulator (uji coba di browser, tanpa akun Apple)
    # Menghasilkan Runner.zip untuk iPhone Simulator. Unggah ke https://appetize.io (Upload app → iOS)
    # untuk mencoba aplikasi di iPhone virtual lewat browser. Tidak bisa dipasang di iPhone asli.
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase
    scripts:
      - name: Pasang konfigurasi Firebase dari variabel rahasia (tidak disimpan di Git)
        script: |
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Ambil paket Flutter
        script: flutter pub get
      - name: Build untuk iPhone Simulator
        script: |
          set -ex
          # mobile_scanner 6 memakai Google ML Kit yang tidak punya versi simulator arm64 (Apple Silicon),
          # jadi build simulator dibuat khusus x86_64. Appetize dan simulator di Mac tetap bisa menjalankannya.
          flutter build ios --simulator --debug --config-only
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/xcsim \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
          APP_DIR="$(cd build/xcsim/Build/Products/Debug-iphonesimulator/Runner.app && pwd -P)"
          rm -rf build/sim && mkdir -p build/sim
          ditto "$APP_DIR" build/sim/Runner.app
          cd build/sim && zip -qry Runner.zip Runner.app && ls -la Runner.zip
    artifacts:
      - build/sim/Runner.zip
      - /tmp/xcodebuild_logs/*.log

  ios-ipa-sideload:
    name: iOS → IPA tanpa tanda tangan (pasang di iPhone lewat Sideloadly, Apple ID gratis)
    # Hasil: PERKAPI-unsigned.ipa. Ditandatangani di Windows oleh Sideloadly memakai Apple ID biasa (gratis).
    # Berlaku 7 hari, lalu pasang ulang. Notifikasi push tidak aktif di cara ini.
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase
    scripts:
      - name: Pasang konfigurasi Firebase dari variabel rahasia (tidak disimpan di Git)
        script: |
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Ambil paket Flutter
        script: flutter pub get
      - name: Build IPA tanpa tanda tangan
        script: |
          set -ex
          # Flutter versi baru (Swift Package Manager) kadang tetap meminta Development Team walau --no-codesign.
          # Karena itu Flutter hanya menyiapkan konfigurasi, lalu Xcode membangun dengan tanda tangan dimatikan.
          flutter build ios --release --no-codesign --config-only
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/xc \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
          ls -la build/xc/Build/Products/Release-iphoneos/
          # Runner.app bisa berupa symlink: ikuti ke folder aslinya, salin utuh dengan ditto.
          APP_DIR="$(cd build/xc/Build/Products/Release-iphoneos/Runner.app && pwd -P)"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          ditto "$APP_DIR" build/ipa/Payload/Runner.app
          test -f build/ipa/Payload/Runner.app/Runner || { echo "Runner.app kosong, IPA dibatalkan"; exit 1; }
          du -sh build/ipa/Payload/Runner.app
          cd build/ipa && zip -qry PERKAPI-unsigned.ipa Payload
          ls -la PERKAPI-unsigned.ipa
    artifacts:
      - build/ipa/PERKAPI-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

  android-apk:
    name: Android → APK
    max_build_duration: 30
    instance_type: mac_mini_m2   # menit gratis Codemagic (500/bulan, akun pribadi) hanya untuk mesin Mac M2
    environment:
      flutter: stable
      groups:
        - firebase
    scripts:
      - name: Pasang konfigurasi Firebase dari variabel rahasia (tidak disimpan di Git)
        script: |
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Ambil paket Flutter
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
